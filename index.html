<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Катруся 🐰</title>

<style>
body{
    margin:0;
    font-family: system-ui, sans-serif;
    background: linear-gradient(180deg,#ffd6e0,#ffeef2);
    display:flex;
    align-items:center;
    justify-content:center;
    height:100vh;
    overflow:hidden;
}

.card{
    width:90%;
    max-width:420px;
    background:white;
    border-radius:30px;
    padding:25px;
    text-align:center;
    box-shadow:0 20px 40px rgba(0,0,0,0.15);
    position:relative;
}

h1{
    margin-top:10px;
    font-size:28px;
}

.bunny{
    font-size:70px;
    animation: hop 1.2s infinite;
}

@keyframes hop{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-10px)}
}

.buttons{
    margin-top:20px;
    position:relative;
    height:120px;
}

button{
    padding:14px 20px;
    border:none;
    border-radius:16px;
    font-size:18px;
    cursor:pointer;
}

.yes{
    background:#ff4d6d;
    color:white;
    width:120px;
}

.no{
    background:#eee;
    position:absolute;
    width:120px;
}

.hidden{display:none}

.hearts{
    position:fixed;
    inset:0;
    pointer-events:none;
}

.heart{
    position:absolute;
    font-size:22px;
    animation:float 4s linear forwards;
}

@keyframes float{
    from{transform:translateY(100vh);opacity:1}
    to{transform:translateY(-10vh);opacity:0}
}
</style>
</head>

<body>

<div class="card">
    <div class="bunny">🐰</div>
    <h1>Будеш моєю Банжі?</h1>
    <p>Навіки</p>

    <div class="buttons">
        <button class="yes" onclick="yes()">Таккккк 💖💖💖💖💖</button>
        <button class="no" id="noBtn">Іншого варінту не існує</button>
    </div>

    <div id="result" class="hidden">
        <h2>Урааааааа🐰💘</h2>
        <p></p>
    </div>
</div>

<div class="hearts" id="hearts"></div>

<script>
const noBtn = document.getElementById("noBtn");

function moveNo(){
    const card = document.querySelector(".card");
    const rect = card.getBoundingClientRect();

    const x = Math.random()*(rect.width-120);
    const y = Math.random()*(rect.height-120);

    noBtn.style.left = x+"px";
    noBtn.style.top = y+"px";
}

noBtn.addEventListener("touchstart", moveNo);
noBtn.addEventListener("mouseover", moveNo);

function yes(){
    document.getElementById("result").classList.remove("hidden");
    spawnHearts();
}

function spawnHearts(){
    setInterval(()=>{
        const heart=document.createElement("div");
        heart.className="heart";
        heart.innerHTML="💗";
        heart.style.left=Math.random()*100+"vw";
        heart.style.fontSize=(20+Math.random()*25)+"px";
        document.getElementById("hearts").appendChild(heart);
        setTimeout(()=>heart.remove(),4000);
    },200);
}
</script>

</body>
</html>
